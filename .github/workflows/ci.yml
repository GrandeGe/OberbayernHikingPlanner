name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Lint
        run: ruff check src/ main.py tests/

      - name: Test
        # `-m "not live"` comes from pyproject addopts. CI must never depend on
        # Overpass, Nominatim, Bright Sky or the MVV feed being up.
        run: pytest -v --cov=src --cov-report=term-missing
